<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Contactos</title>
    <link

  <body>
    <main id="main">

        <h2 id="main-tittle">Lista de Contactos</h2>

        <div class="contact-form">
          <h3>Agregar Contacto</h3>
          <form id="main-form">
            <input
              type="text"
              id="taskinput"
              placeholder="Añadir un nombre y apellido"
              required
            />
          </form>
          <div>
            <p class="errormenssage">Tiene que tener nombre y apellido</p>
            <p class="errormenssage">

            </p>
          </div>
          <form id="form">
            <input
              type="text"
              id="taskinput1"
              placeholder="Añadir un numero de telefono"
              required
            />
          </form>
          <button type="submit" class="creat-button">crear</button>
        </div>

          <h3 class="text-2">Contactos</h3>
